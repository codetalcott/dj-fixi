[project]
name = "dj-fixi"
version = "0.4.0"
description = "Django integration for Fixi.js - server-side rendering with hypermedia"
authors = [{name = "William Talcott"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/codetalcott/dj-fixi"
Source = "https://github.com/codetalcott/dj-fixi"
Changelog = "https://github.com/codetalcott/dj-fixi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
browser = ["playwright"]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
    "pytest-django>=4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "Q", "UP", "W"]
ignore = ["E501"]
