{% load fixi_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>{% block title %}dj-fixi Demo{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    {# fixi.js, the FX-Trigger event bridge, and the extension attributes (confirm, debounce, CSRF). #}
    {% fixi_scripts %}
</head>
<body>
    {% block body %}{% endblock %}

    <div id="toast" hidden style="position:fixed;bottom:1rem;right:1rem;padding:.75rem 1rem;border-radius:.5rem;background:#222;color:#fff"></div>

    <script>
        // fixi-events.js turns the FX-Trigger response header into these CustomEvents.
        const toast = (msg) => {
            const el = document.getElementById("toast");
            el.textContent = msg;
            el.hidden = false;
            setTimeout(() => { el.hidden = true; }, 2500);
        };
        document.addEventListener("formSuccess", (e) => toast(e.detail?.message || "Saved"));
        document.addEventListener("formError", () => toast("Please fix the errors below"));
    </script>
</body>
</html>
