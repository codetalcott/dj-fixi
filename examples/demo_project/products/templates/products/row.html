{% load fixi_tags %}
<tr id="row-{{ object.pk }}">
    <td>{{ object.name }}</td>
    <td>${{ object.price }}</td>
    <td>{{ object.stock }}</td>
    <td>{% if object.is_active %}✓{% else %}✗{% endif %}</td>
    <td>
        <button
            fx-action="{% url 'product_update_row' object.pk %}?edit=1"
            fx-method="GET"
            fx-target="#row-{{ object.pk }}"
            fx-swap="outerHTML">
            Edit
        </button>
        <button
            fx-action="{% url 'product_delete_backend' object.pk %}"
            fx-method="DELETE"
            fx-target="#row-{{ object.pk }}"
            fx-swap="outerHTML"
            onclick="return confirm('Delete {{ object.name }}?')">
            Delete
        </button>
    </td>
</tr>
