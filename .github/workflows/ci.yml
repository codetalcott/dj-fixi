name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.17.4 check .
      - run: uvx ruff@0.17.4 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", django: "4.2"}
          - {python: "3.12", django: "5.2"}
          - {python: "3.13", django: "6.0"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest
        run: >
          uv run --no-project --python ${{ matrix.python }}
          --with "django~=${{ matrix.django }}.0" --with pytest --with pytest-django
          --with-editable . pytest -q
      - name: system checks on the demo
        working-directory: examples/demo_project
        run: >
          uv run --no-project --python ${{ matrix.python }}
          --with "django~=${{ matrix.django }}.0" --with-editable ../..
          python manage.py check --fail-level WARNING
      - name: fixi_lint on the demo
        working-directory: examples/demo_project
        run: >
          uv run --no-project --python ${{ matrix.python }}
          --with "django~=${{ matrix.django }}.0" --with-editable ../..
          python manage.py fixi_lint
      - name: demo tests
        working-directory: examples/demo_project
        run: >
          uv run --no-project --python ${{ matrix.python }}
          --with "django~=${{ matrix.django }}.0" --with pytest --with pytest-django
          --with-editable ../.. python -m pytest -q

  # dj-fixi-tables builds on this package's public API. Run its suite against
  # this checkout so a change that breaks it fails here, before the merge.
  downstream:
    runs-on: ubuntu-latest
    env:
      RUN: >-
        uv run --no-project --python 3.13 --with django~=6.0.0 --with pytest
        --with pytest-django --with-editable ${{ github.workspace }}
        --with-editable ${{ github.workspace }}/dj-fixi-tables
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: codetalcott/dj-fixi-tables
          path: dj-fixi-tables
      - uses: astral-sh/setup-uv@v5
      - name: dj-fixi-tables' suite
        working-directory: dj-fixi-tables
        run: $RUN python -m pytest -q
      - name: dj-fixi-tables' demo
        working-directory: dj-fixi-tables/examples/demo_project
        run: $RUN python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    env:
      RUN: >-
        uv run --no-project --python 3.13 --with django~=6.0.0 --with pytest
        --with pytest-django --with playwright
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install Chromium
        run: $RUN python -m playwright install --with-deps chromium
      - name: the events shim in a browser
        run: $RUN --with-editable . python -m pytest -q -m browser
      - name: the demo's pitfalls in a browser
        working-directory: examples/demo_project
        run: $RUN --with-editable ../.. python -m pytest -q -m browser
